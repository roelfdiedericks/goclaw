{{template "header" .}}

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h1 class="h4 mb-0">
                    <i class="bi bi-journal-text"></i> Transcript
                    {{if .IsSupervising}}<span class="text-muted">/ {{.SuperviseSession}}</span>{{end}}
                </h1>
                <span class="badge bg-secondary">Saved browser transcript</span>
            </div>
            <p class="text-muted small mb-3">
                Read-only view rendered from localStorage on this browser profile.
            </p>

            <div id="transcript-messages" class="pb-4"></div>
            <div id="transcript-empty" class="alert alert-light border d-none">
                No saved transcript found in localStorage.
            </div>
        </div>
    </div>
</div>

<script src="/js/goclaw-common.js?v={{.Timestamp.UnixNano}}"></script>
<script>
window.__GOCLAW_TRANSCRIPT_CONFIG__ = {{.TranscriptConfigJS}};
</script>
<script src="/js/transcript.js?v={{.Timestamp.UnixNano}}"></script>

{{template "footer" .}}

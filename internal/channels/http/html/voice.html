{{template "header" .}}

<style>
    .audio-visualizer {
        height: 40px;
        background: #f8f9fa;
        border-radius: 0.375rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
    }
    .visualizer-bar {
        width: 3px;
        background: #28a745;
        border-radius: 2px;
        transition: height 0.05s;
    }
    .timer {
        font-family: monospace;
        font-size: 1.25rem;
        min-width: 80px;
    }
    .voice-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 0.5rem;
    }
    .voice-indicator.disconnected { background: #6c757d; }
    .voice-indicator.connecting { background: #ffc107; animation: pulse 1s infinite; }
    .voice-indicator.connected { background: #28a745; }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .message.partial .bubble {
        opacity: 0.7;
    }
</style>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <span class="voice-indicator disconnected" id="voiceIndicator"></span>
                    <i class="bi bi-mic me-2"></i>
                    <span>Voice Chat</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="timer" id="timer">00:00</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="clear-history" title="Clear chat history">
                        <i class="bi bi-trash"></i>
                    </button>
                    <span id="connection-status" class="badge bg-secondary">Disconnected</span>
                    <button class="btn btn-success btn-sm" id="voiceBtn">
                        <i class="bi bi-telephone-fill me-1"></i> Connect
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="audio-visualizer mb-3" id="visualizer" style="display: none;">
                    <div class="visualizer-bar" style="height: 10px;"></div>
                    <div class="visualizer-bar" style="height: 15px;"></div>
                    <div class="visualizer-bar" style="height: 20px;"></div>
                    <div class="visualizer-bar" style="height: 25px;"></div>
                    <div class="visualizer-bar" style="height: 20px;"></div>
                    <div class="visualizer-bar" style="height: 15px;"></div>
                    <div class="visualizer-bar" style="height: 10px;"></div>
                </div>
                <div class="chat-container" id="chat-messages">
                    <!-- Messages will be inserted here -->
                </div>
            </div>
            <div class="card-footer text-muted small">
                <i class="bi bi-shield-check me-1"></i>
                Voice is processed by xAI. Audio is not stored locally.
            </div>
        </div>
    </div>
</div>

<!-- Load shared utilities -->
<script src="/js/goclaw-common.js"></script>

<script>
$(document).ready(function() {
    // === SHARED WITH CHAT.HTML - History & SSE ===
    var eventSource = null;
    var reconnectTimer = null;
    var $messages = $('#chat-messages');
    var $status = $('#connection-status');
    
    var STORAGE_KEY = 'goclaw_voice_history';
    var MAX_MESSAGES = 100;
    
    // Configure marked.js
    marked.setOptions({
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                try {
                    return hljs.highlight(code, { language: lang }).value;
                } catch (e) {}
            }
            return code;
        },
        breaks: true,
        gfm: true
    });
    
    // Use chat.html's renderMarkdown/renderMediaRefs (override shared lib for jQuery compat)
    function renderMarkdown(text) {
        if (!text) return '';
        var html = marked.parse(text);
        html = DOMPurify.sanitize(html);
        html = renderMediaRefs(html);
        return html;
    }
    
    function renderMediaRefs(html) {
        var pattern = /\{\{media:([a-z]+\/[a-z0-9.+-]+):'((?:[^'\\]|\\.)*)'\}\}/gi;
        return html.replace(pattern, function(match, mime, escapedPath) {
            var path = unescapeMediaPath(escapedPath);
            var url = '/api/media?path=' + encodeURIComponent(path);
            var filename = path.split('/').pop();
            
            if (mime.startsWith('error/')) {
                var errorType = mime.split('/')[1];
                return '<div class="chat-media-error"><i class="bi bi-exclamation-triangle"></i> ' +
                    (errorType === 'not-found' ? 'File not found: ' : 'Invalid path: ') +
                    '<code>' + escapeHtml(filename) + '</code></div>';
            }
            
            if (mime.startsWith('image/')) {
                return '<img src="' + url + '" class="chat-media chat-media-image" alt="' + escapeHtml(filename) + '" loading="lazy">';
            } else if (mime.startsWith('video/')) {
                return '<video src="' + url + '" controls class="chat-media chat-media-video"></video>';
            } else if (mime.startsWith('audio/')) {
                return '<audio src="' + url + '" controls class="chat-media-audio"></audio>';
            } else {
                return '<a href="' + url + '" download class="chat-media-link"><i class="bi bi-file-earmark-arrow-down"></i> ' +
                    escapeHtml(filename) + '</a>';
            }
        });
    }
    
    function unescapeMediaPath(s) {
        return s.replace(/\\'/g, "'").replace(/\\\\/g, "\\");
    }
    
    function escapeHtml(text) {
        return $('<div>').text(text).html();
    }
    
    // Load chat history from localStorage
    function loadHistory() {
        try {
            var history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history.forEach(function(msg) {
                renderMessage(msg.role, msg.content, false, msg.source);
            });
            $messages.scrollTop($messages[0].scrollHeight);
        } catch (e) {
            console.error('Failed to load chat history:', e);
        }
    }
    
    // Save chat history to localStorage
    function saveHistory() {
        try {
            var messages = [];
            $messages.find('.message').each(function() {
                var $msg = $(this);
                var role = 'assistant';
                if ($msg.hasClass('user')) role = 'user';
                else if ($msg.hasClass('error')) role = 'error';
                else if ($msg.hasClass('mirror-user')) role = 'mirror-user';
                else if ($msg.hasClass('mirror-assistant')) role = 'mirror-assistant';
                
                var rawContent = $msg.data('raw-content');
                var content = rawContent || $msg.find('.bubble').text();
                var source = $msg.data('source');
                
                var msgData = { role: role, content: content };
                if (source) msgData.source = source;
                messages.push(msgData);
            });
            if (messages.length > MAX_MESSAGES) {
                messages = messages.slice(-MAX_MESSAGES);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        } catch (e) {
            console.error('Failed to save chat history:', e);
        }
    }
    
    function clearHistory() {
        localStorage.removeItem(STORAGE_KEY);
        $messages.empty();
    }
    
    // Render a message (same as chat.html)
    function renderMessage(role, content, save, source) {
        var roleClass = 'assistant';
        if (role === 'user') roleClass = 'user';
        else if (role === 'error') roleClass = 'error';
        else if (role.startsWith('mirror-')) roleClass = 'mirror ' + role;
        
        var $msg = $('<div class="message ' + roleClass + '"><div class="bubble"></div></div>');
        $msg.data('raw-content', content);
        if (source) $msg.data('source', source);
        
        var $bubble = $msg.find('.bubble');
        
        // For mirror messages, show source
        if (role.startsWith('mirror-') && source) {
            $bubble.append('<small class="text-muted">[' + escapeHtml(source) + ']</small><br>');
        }
        
        if (content) {
            if (role === 'error') {
                $bubble.append($('<span>').text(content));
            } else {
                $bubble.append(renderMarkdown(content));
            }
        }
        
        $messages.append($msg);
        if (save !== false) saveHistory();
        return $msg;
    }
    
    // Connect to SSE for mirrored messages (same as chat.html)
    function connectSSE() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
        
        $status.text('Connecting...').removeClass('bg-success bg-danger').addClass('bg-secondary');
        eventSource = new EventSource('/api/events');
        
        eventSource.addEventListener('connected', function(e) {
            $status.text('Connected').removeClass('bg-secondary bg-danger').addClass('bg-success');
        });
        
        eventSource.addEventListener('mirror', function(e) {
            var data = JSON.parse(e.data);
            // Skip messages from http_voice - we already have them via WebSocket
            if (data.source === 'http_voice') {
                return;
            }
            if (data.userMsg) {
                renderMessage('mirror-user', data.userMsg, true, data.source);
            }
            if (data.response) {
                renderMessage('mirror-assistant', data.response, true, data.source);
            }
            $messages.scrollTop($messages[0].scrollHeight);
        });
        
        eventSource.onerror = function(e) {
            $status.text('Disconnected').removeClass('bg-success bg-secondary').addClass('bg-danger');
            eventSource.close();
            eventSource = null;
            reconnectTimer = setTimeout(connectSSE, 3000);
        };
    }
    
    $('#clear-history').click(function() {
        if (confirm('Clear all chat history?')) {
            clearHistory();
        }
    });
    
    // Click on media to enlarge
    $(document).on('click', '.chat-media-image, .chat-media-video', function() {
        var src = $(this).attr('src');
        var isVideo = $(this).is('video');
        var $modal = $('#media-modal');
        var $content = $('#media-modal-content');
        
        $content.empty();
        if (isVideo) {
            $content.append('<video src="' + src + '" controls autoplay></video>');
        } else {
            $content.append('<img src="' + src + '">');
        }
        $modal.addClass('active');
    });
    
    $('#media-modal').click(function(e) {
        if (e.target === this || $(e.target).hasClass('close-btn') || $(e.target).parent().hasClass('close-btn')) {
            $(this).removeClass('active');
            $(this).find('video').each(function() { this.pause(); });
        }
    });
    
    // === VOICE-SPECIFIC ===
    var voiceWs = null;
    var audioContext = null;
    var workletNode = null;
    var mediaStream = null;
    var playbackContext = null;
    var voiceConnected = false;
    var startTime = null;
    var timerInterval = null;
    var currentUserBubble = null;
    var currentAssistantBubble = null;
    
    var $voiceBtn = $('#voiceBtn');
    var $timer = $('#timer');
    var $voiceIndicator = $('#voiceIndicator');
    var $visualizer = $('#visualizer');
    
    function setVoiceState(state) {
        $voiceIndicator.removeClass('disconnected connecting connected').addClass(state);
        
        if (state === 'connected') {
            $voiceBtn.removeClass('btn-success btn-warning').addClass('btn-danger')
                .html('<i class="bi bi-telephone-x-fill me-1"></i> Disconnect');
            $voiceBtn.prop('disabled', false);
            $visualizer.show();
        } else if (state === 'connecting') {
            $voiceBtn.removeClass('btn-success btn-danger').addClass('btn-warning')
                .html('<i class="bi bi-hourglass-split me-1"></i> Connecting...');
            $voiceBtn.prop('disabled', true);
        } else {
            $voiceBtn.removeClass('btn-danger btn-warning').addClass('btn-success')
                .html('<i class="bi bi-telephone-fill me-1"></i> Connect');
            $voiceBtn.prop('disabled', false);
            $visualizer.hide();
        }
    }
    
    $voiceBtn.click(function() {
        if (voiceConnected) {
            disconnectVoice();
        } else {
            connectVoice();
        }
    });
    
    function connectVoice() {
        setVoiceState('connecting');
        
        var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        voiceWs = new WebSocket(protocol + '//' + location.host + '/voice/ws');
        
        voiceWs.onopen = function() {
            voiceWs.send(JSON.stringify({ type: 'connect' }));
        };
        
        voiceWs.onmessage = function(event) {
            var msg = JSON.parse(event.data);
            handleVoiceMessage(msg);
        };
        
        voiceWs.onerror = function(err) {
            console.error('Voice WebSocket error:', err);
            renderMessage('error', 'Voice connection error', true);
            disconnectVoice();
        };
        
        voiceWs.onclose = function() {
            if (voiceConnected) {
                disconnectVoice();
            }
        };
    }
    
    function disconnectVoice() {
        if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
            voiceWs.send(JSON.stringify({ type: 'disconnect' }));
            voiceWs.close();
        }
        voiceWs = null;
        stopAudio();
        voiceConnected = false;
        startTime = null;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        setVoiceState('disconnected');
        $timer.text('00:00');
        currentUserBubble = null;
        currentAssistantBubble = null;
    }
    
    function handleVoiceMessage(msg) {
        console.log('Voice WS:', msg.type, msg);
        
        switch (msg.type) {
            case 'connected':
                voiceConnected = true;
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                setVoiceState('connected');
                startAudio();
                break;
                
            case 'transcript':
                if (msg.transcript || msg.isFinal) {
                    updateTranscript(msg.transcript || '', msg.role, msg.isFinal);
                }
                break;
                
            case 'mirror':
                // User message from another channel (with source label)
                if (msg.userMsg) {
                    renderMessage('mirror-user', msg.userMsg, true, msg.source);
                }
                break;
                
            case 'agent_message':
                // Direct agent output (tool messages, etc.)
                if (msg.message) {
                    renderMessage('assistant', msg.message, true);
                }
                break;
                
            case 'error':
                renderMessage('error', msg.error, true);
                break;
                
            case 'audio':
                playAudio(msg.audio);
                break;
        }
    }
    
    function updateTranscript(text, role, isFinal) {
        if (role === 'user') {
            if (isFinal && text) {
                if (currentUserBubble) {
                    currentUserBubble.find('.bubble').html(renderMarkdown(text));
                    currentUserBubble.data('raw-content', text);
                    currentUserBubble.removeClass('partial');
                } else {
                    renderMessage('user', text, true);
                }
                currentUserBubble = null;
                saveHistory();
            }
        } else {
            if (text) {
                if (!currentAssistantBubble) {
                    currentAssistantBubble = renderMessage('assistant', '', false);
                    currentAssistantBubble.addClass('partial');
                }
                var existingText = currentAssistantBubble.data('raw-content') || '';
                var newText = existingText + text;
                currentAssistantBubble.data('raw-content', newText);
                currentAssistantBubble.find('.bubble').html(renderMarkdown(newText));
            }
            
            if (isFinal && currentAssistantBubble) {
                currentAssistantBubble.removeClass('partial');
                currentAssistantBubble = null;
                saveHistory();
            }
        }
        $messages.scrollTop($messages[0].scrollHeight);
    }
    
    function updateTimer() {
        if (!startTime) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        var secs = (elapsed % 60).toString().padStart(2, '0');
        $timer.text(mins + ':' + secs);
    }
    
    async function startAudio() {
        try {
            audioContext = new AudioContext();
            var nativeSampleRate = audioContext.sampleRate;
            
            mediaStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    sampleRate: nativeSampleRate,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                } 
            });
            
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            await audioContext.audioWorklet.addModule('/js/voice-worklet.js');
            
            var source = audioContext.createMediaStreamSource(mediaStream);
            workletNode = new AudioWorkletNode(audioContext, 'voice-processor');
            
            workletNode.port.onmessage = function(e) {
                if (e.data.type === 'init') {
                    if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
                        voiceWs.send(JSON.stringify({
                            type: 'capabilities',
                            browserSampleRate: e.data.sampleRate,
                            outputSampleRate: e.data.sampleRate,
                            userAgent: navigator.userAgent,
                            audioConstraints: 'channelCount=1,echoCancellation=true,noiseSuppression=true,autoGainControl=true'
                        }));
                    }
                } else if (e.data.type === 'level') {
                    updateVisualizer(e.data.rms);
                } else if (e.data.type === 'audio') {
                    if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
                        voiceWs.send(JSON.stringify({ type: 'audio', audio: e.data.audio }));
                    }
                }
            };
            
            source.connect(workletNode);
            
        } catch (err) {
            console.error('Audio error:', err);
            renderMessage('error', 'Microphone error: ' + err.message, true);
            disconnectVoice();
        }
    }
    
    function updateVisualizer(rms) {
        var bars = $visualizer.find('.visualizer-bar');
        var level = Math.min(1, rms * 10);
        
        bars.each(function(i) {
            var centerWeight = 1 - Math.abs(i - 3) / 4;
            var height = 5 + (level * 35 * centerWeight) + (Math.random() * 5 * level);
            $(this).css('height', height + 'px');
        });
    }
    
    function stopAudio() {
        if (workletNode) {
            workletNode.disconnect();
            workletNode = null;
        }
        if (audioContext) {
            audioContext.close();
            audioContext = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(function(track) { track.stop(); });
            mediaStream = null;
        }
        if (playbackContext) {
            playbackContext.close();
            playbackContext = null;
        }
    }
    
    var audioQueue = [];
    var isPlaying = false;
    
    function playAudio(b64) {
        if (!b64) return;
        
        try {
            var binaryString = atob(b64);
            var bytes = new Uint8Array(binaryString.length);
            for (var i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            var int16 = new Int16Array(bytes.buffer);
            var float32 = new Float32Array(int16.length);
            for (var i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / 32768;
            }
            
            audioQueue.push(float32);
            playNextChunk();
        } catch (err) {
            console.error('Audio playback error:', err);
        }
    }
    
    function playNextChunk() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;
        
        if (!playbackContext) {
            playbackContext = new AudioContext({ sampleRate: 48000 });
        }
        
        var chunk = audioQueue.shift();
        var buffer = playbackContext.createBuffer(1, chunk.length, 48000);
        buffer.getChannelData(0).set(chunk);
        
        var source = playbackContext.createBufferSource();
        source.buffer = buffer;
        source.connect(playbackContext.destination);
        source.onended = function() {
            isPlaying = false;
            playNextChunk();
        };
        source.start();
    }
    
    // Cleanup on page unload
    $(window).on('beforeunload', function() {
        if (voiceConnected) {
            disconnectVoice();
        }
    });
    
    // Initialize
    loadHistory();
    connectSSE();
});
</script>

{{template "footer" .}}

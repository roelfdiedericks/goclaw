{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <style>
        body { 
            padding-top: 56px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
        }
        .navbar-brand { font-weight: bold; }
        .chat-container { height: calc(100vh - 200px); overflow-y: auto; }

        /* /chat only — Layout Option B: document (window) scroll + fixed composer bar */
        :root {
            --chat-composer-reserve: 7.5rem;
        }
        body.chat-page {
            overflow: hidden;
            height: 100vh;
        }
        main.chat-page-shell {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px);
            min-height: calc(100vh - 56px);
            overflow: hidden;
        }
        body.chat-page .chat-root {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            padding-bottom: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body.chat-page .chat-page-row,
        body.chat-page .chat-page-row > div {
            display: flex;
            flex: 1 1 auto;
            min-height: 0;
        }
        body.chat-page .chat-page-card {
            --bs-card-border-width: 0;
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            border: 0;
            box-shadow: none;
            background: transparent;
            overflow: hidden;
        }
        body.chat-page .chat-page-card > .card-header {
            position: static;
            flex: 0 0 auto;
            background-color: var(--bs-body-bg, #fff);
            border: none;
            border-bottom: 1px solid var(--bs-border-color, #dee2e6);
            border-radius: 0;
        }
        body.chat-page .chat-page-card > .card-body.chat-container {
            flex: 1 1 auto;
            height: auto !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            min-height: 0;
            padding-top: 1rem;
            padding-bottom: 0.5rem;
        }
        body.chat-page .chat-page-card > .card-body.chat-container.initial-history-anchor {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            scrollbar-gutter: stable;
        }
        body.chat-page .chat-composer-bar {
            --bs-card-cap-bg: var(--bs-body-bg);
            position: static;
            flex: 0 0 auto;
            background-color: var(--bs-body-bg, #fff);
            border: none;
            box-shadow: none;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        /* Flat composer field: no grey input frame; focus ring for keyboard/mouse */
        body.chat-page .chat-composer-bar #message-input.form-control {
            border: 0;
            box-shadow: none;
            background-color: var(--bs-tertiary-bg);
        }
        body.chat-page .chat-composer-bar #message-input.form-control:focus {
            border: 0;
            background-color: var(--bs-tertiary-bg);
            box-shadow: 0 0 0 0.25rem var(--bs-focus-ring-color, rgba(13, 110, 253, 0.25));
        }
        body.chat-page .chat-composer-bar #message-input.form-control:focus-visible {
            outline: 0;
        }
        .message { margin-bottom: 1rem; }
        .message.user { text-align: right; }
        .message.assistant { text-align: left; }
        .message .bubble {
            display: inline-block;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            max-width: 80%;
        }
        .message.user .bubble { background: #007bff; color: white; }
        .message.assistant .bubble { background: #e9ecef; }
        .message.error .bubble { background: #f8d7da; color: #721c24; }
        .message.mirror .bubble { background: #fff3cd; color: #856404; font-size: 0.9em; }
        .message.mirror-user .bubble { background: #d4edda; color: #155724; font-size: 0.9em; }
        .typing-indicator { 
            color: #6c757d; 
            font-style: italic; 
            padding: 0.5rem 0;
        }
        .typing-indicator .dots {
            display: inline-block;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background: #6c757d;
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator .dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator .dots span:nth-child(2) { animation-delay: -0.16s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0s; }
        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .media-bubble img { max-width: 100%; max-height: 400px; border-radius: 0.5rem; display: block; }
        .media-caption { margin-top: 0.5rem; font-size: 0.9em; color: #666; }
        
        /* Markdown content styling */
        .bubble p { margin: 0 0 0.5rem 0; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble pre { 
            background: #1e1e1e; 
            border-radius: 0.5rem; 
            padding: 0.75rem; 
            margin: 0.5rem 0;
            overflow-x: auto;
        }
        .bubble code { 
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.85em;
        }
        .bubble pre code { 
            color: #d4d4d4; 
            background: transparent;
            padding: 0;
        }
        .bubble :not(pre) > code {
            background: rgba(0,0,0,0.1);
            padding: 0.15rem 0.3rem;
            border-radius: 0.25rem;
        }
        .message.user .bubble :not(pre) > code {
            background: rgba(255,255,255,0.2);
        }
        .bubble ul, .bubble ol { 
            margin: 0.5rem 0; 
            padding-left: 1.5rem; 
        }
        .bubble li { margin: 0.25rem 0; }
        .bubble blockquote {
            border-left: 3px solid #dee2e6;
            margin: 0.5rem 0;
            padding-left: 0.75rem;
            color: #6c757d;
        }
        .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
            margin: 0.75rem 0 0.5rem 0;
            font-size: 1em;
            font-weight: 600;
        }
        .bubble h1 { font-size: 1.2em; }
        .bubble h2 { font-size: 1.1em; }
        .bubble a { color: inherit; text-decoration: underline; }
        .bubble table {
            border-collapse: collapse;
            margin: 0.5rem 0;
            font-size: 0.9em;
        }
        .bubble th, .bubble td {
            border: 1px solid #dee2e6;
            padding: 0.3rem 0.5rem;
        }
        .bubble th { background: rgba(0,0,0,0.05); }
        
        /* Image preview */
        .image-preview-container {
            padding: 0.5rem 0;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #dee2e6;
        }
        .image-preview-item {
            display: inline-block;
            position: relative;
            max-width: 150px;
        }
        .image-preview-item img {
            max-width: 150px;
            max-height: 100px;
            border-radius: 0.5rem;
            border: 2px solid #007bff;
        }
        .btn-close-preview {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            padding: 0;
        }
        .btn-close-preview:hover {
            background: #c82333;
        }
        
        /* Inline media */
        .chat-media {
            max-width: 100%;
            max-height: 400px;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
            display: block;
            cursor: pointer;
        }
        .chat-media-image:hover {
            opacity: 0.9;
        }
        .chat-media-video {
            background: #000;
        }
        .chat-media-audio {
            width: 100%;
            margin: 0.5rem 0;
        }
        .chat-media-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #e9ecef;
            border-radius: 0.5rem;
            text-decoration: none;
            color: #333;
            margin: 0.5rem 0;
        }
        .chat-media-link:hover {
            background: #dee2e6;
            color: #000;
        }
        .chat-media-error {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #f8d7da;
            color: #721c24;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
        }
        .chat-media-error i {
            color: #dc3545;
        }
        
        /* Media modal for enlarged view */
        #media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        #media-modal.active {
            display: flex;
        }
        #media-modal img,
        #media-modal video {
            max-width: 95%;
            max-height: 95%;
            border-radius: 0.5rem;
        }
        #media-modal video {
            background: #000;
        }
        #media-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        #media-modal .close-btn:hover {
            opacity: 1;
        }
        
        /* Tool call display (thinking mode) */
        .tool-call {
            background: #f8f9fa;
            border-left: 3px solid #6c757d;
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 0.5rem 0.75rem;
            margin: 0.5rem 0;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.85em;
        }
        .tool-call-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .tool-call-icon { color: #6c757d; }
        .tool-call-name { font-weight: 600; color: #495057; }
        .tool-call-status { margin-left: auto; }
        .tool-call-status.running { color: #0d6efd; }
        .tool-call-status.completed { color: #198754; }
        .tool-call-status.error { color: #dc3545; }
        .tool-call-input, .tool-call-output {
            background: #e9ecef;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            margin: 0.25rem 0;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 100px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .tool-call-input.expanded, .tool-call-output.expanded {
            max-height: none;
        }
        .tool-call-input::after, .tool-call-output::after {
            content: '▼ Click to expand';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, #e9ecef 50%);
            text-align: center;
            padding: 0.5rem;
            font-size: 0.75em;
            color: #6c757d;
        }
        .tool-call-input.expanded::after, .tool-call-output.expanded::after {
            display: none;
        }
        .tool-call-duration {
            font-size: 0.8em;
            color: #6c757d;
        }

        /* Tool activity panel (phase 1 compact list) */
        .tool-activity-panel {
            background: #f8f9fa;
            border-left: 3px solid #6c757d;
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 0.5rem 0.75rem;
            margin: 0.5rem 0;
        }
        .tool-activity-panel details > summary {
            cursor: pointer;
            font-weight: 600;
            color: #495057;
            user-select: none;
        }
        .tool-activity-count {
            color: #6c757d;
            font-weight: 500;
            margin-left: 0.25rem;
        }
        .tool-activity-list {
            list-style: none;
            margin: 0.5rem 0 0 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .tool-activity-controls {
            margin-top: 0.5rem;
            display: inline-flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .tool-activity-controls .btn {
            padding: 0.1rem 0.45rem;
            font-size: 0.75rem;
            line-height: 1.2;
        }
        .tool-activity-controls .btn.active {
            background: #495057;
            border-color: #495057;
            color: #fff;
        }
        .tool-activity-item {
            border: 1px solid #dee2e6;
            border-radius: 0.4rem;
            background: #fff;
            padding: 0.2rem 0.5rem;
        }
        .tool-activity-item details > summary {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            list-style: none;
        }
        .tool-activity-item details > summary::-webkit-details-marker {
            margin-right: 0.25rem;
        }
        .tool-activity-name {
            font-weight: 600;
            color: #343a40;
        }
        .tool-activity-preview {
            color: #6c757d;
            font-size: 0.88em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .tool-activity-duration {
            color: #6c757d;
            font-size: 0.82em;
            white-space: nowrap;
        }
        .tool-activity-status {
            text-transform: uppercase;
            font-size: 0.65em;
            letter-spacing: 0.03em;
        }
        .tool-activity-status.running {
            background: #0d6efd;
        }
        .tool-activity-status.completed {
            background: #198754;
        }
        .tool-activity-status.error {
            background: #dc3545;
        }
        .tool-activity-body {
            margin-top: 0.45rem;
            border-top: 1px dashed #e5e7eb;
            padding-top: 0.45rem;
        }
        .tool-activity-section-label {
            font-size: 0.76em;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.2rem;
        }
        .tool-activity-pre {
            margin: 0 0 0.35rem 0;
            background: #f3f4f6;
            border-radius: 0.25rem;
            padding: 0.35rem 0.5rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 180px;
            overflow: auto;
            font-size: 0.82em;
        }
        .run-debug-host {
            margin-top: 0.5rem;
        }
        
        /* Thinking/reasoning content */
        .thinking-content {
            background: #fff3cd;
            border-left: 3px solid #ffc107;
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 0.5rem 0.75rem;
            margin: 0.5rem 0;
            color: #856404;
        }
        .thinking-content summary {
            cursor: pointer;
            font-weight: 500;
        }
        .thinking-content summary i {
            margin-right: 0.5rem;
        }
        .thinking-text {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 0.25rem;
            white-space: pre-wrap;
            font-style: italic;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
        }
        
        /* System messages */
        .message.system .bubble {
            background: #d1ecf1;
            color: #0c5460;
            font-size: 0.9em;
        }
        
        /* Thinking toggle button */
        #thinking-toggle {
            margin-right: 1rem;
        }
        #thinking-toggle.active {
            background: #0d6efd !important;
            border-color: #0d6efd !important;
            color: white !important;
        }
        
        /* Spin animation for running status */
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body{{if .ChatPage}} class="chat-page"{{end}}>
    <!-- Media modal for enlarged view -->
    <div id="media-modal">
        <span class="close-btn"><i class="bi bi-x-lg"></i></span>
        <div id="media-modal-content"></div>
    </div>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-robot"></i> GoClaw</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" data-nav-path="/" href="/"><i class="bi bi-house"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-nav-path="/chat" href="/chat"><i class="bi bi-chat"></i> Chat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-nav-path="/voice" href="/voice"><i class="bi bi-mic"></i> Voice</a>
                    </li>
                    {{if .User.IsOwner}}
                    <li class="nav-item">
                        <a class="nav-link" data-nav-path="/runners" href="/runners"><i class="bi bi-list-task"></i> Runners</a>
                    </li>
                    {{end}}
                </ul>
                <button id="thinking-toggle" class="btn btn-outline-secondary btn-sm d-none" 
                        title="Thinking OFF (click to toggle)">
                    <i class="bi bi-lightbulb"></i> Thinking
                </button>
                {{if .User.IsOwner}}
                <div class="nav-item dropdown me-2">
                    <a class="nav-link dropdown-toggle text-light" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-gear"></i> Setup
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/setup/wizard"><i class="bi bi-magic"></i> Run Wizard</a></li>
                        <li><a class="dropdown-item" href="/setup/edit"><i class="bi bi-sliders"></i> Edit Configuration</a></li>
                    </ul>
                </div>
                {{end}}
                <span class="navbar-text">
                    <i class="bi bi-person-circle"></i> {{.User.Name}}
                    {{if .User.Role}}<span class="badge {{if eq .User.Role "owner"}}bg-warning text-dark{{else if eq .User.Role "guest"}}bg-secondary{{else}}bg-info{{end}}">{{.User.Role}}</span>{{end}}
                </span>
            </div>
        </div>
    </nav>
    {{if .ChatPage}}
    <main class="chat-page-shell container-fluid px-0 py-2">
    {{else}}
    <main class="container mt-3 mb-2">
    {{end}}
    <script>
    (function() {
        var path = window.location.pathname || "/";
        var links = document.querySelectorAll('a.nav-link[data-nav-path]');
        for (var i = 0; i < links.length; i++) {
            var link = links[i];
            var navPath = link.getAttribute('data-nav-path') || "/";
            var active = false;
            if (navPath === "/") {
                active = path === "/";
            } else {
                active = path === navPath || path.indexOf(navPath + "/") === 0;
            }
            if (active) {
                link.classList.add("active");
                link.setAttribute("aria-current", "page");
            }
        }
    })();
    </script>
{{end}}

name: Release

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  packages: write

jobs:
  # Build Linux AMD64 natively
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ build-essential cmake

      - name: Build whisper.cpp
        run: |
          WHISPER_VERSION=1.8.3
          WHISPER_LIB=$HOME/.goclaw/lib/whisper
          mkdir -p $WHISPER_LIB
          git clone --depth 1 -b v$WHISPER_VERSION https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cp build/src/libwhisper.a $WHISPER_LIB/
          cp build/ggml/src/libggml*.a $WHISPER_LIB/
          cp include/whisper.h $WHISPER_LIB/
          cp ggml/include/*.h $WHISPER_LIB/
          rm -rf /tmp/whisper.cpp

      - name: Download whisper model for bundling
        run: |
          mkdir -p whisper-model
          curl -L -o whisper-model/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

      - name: Set CGO environment
        run: |
          echo "CGO_CFLAGS=-DSQLITE_ENABLE_FTS5 -I$HOME/.goclaw/lib/whisper" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$HOME/.goclaw/lib/whisper $HOME/.goclaw/lib/whisper/libwhisper.a $HOME/.goclaw/lib/whisper/libggml.a $HOME/.goclaw/lib/whisper/libggml-base.a $HOME/.goclaw/lib/whisper/libggml-cpu.a -lm -lstdc++ -fopenmp -lpthread" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: release --clean --split
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1
          GGOOS: linux
          GGOARCH: amd64

      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux-amd64
          path: dist/
          retention-days: 1

  # Build Linux ARM64 natively
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ build-essential cmake

      - name: Build whisper.cpp
        run: |
          WHISPER_VERSION=1.8.3
          WHISPER_LIB=$HOME/.goclaw/lib/whisper
          mkdir -p $WHISPER_LIB
          git clone --depth 1 -b v$WHISPER_VERSION https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cp build/src/libwhisper.a $WHISPER_LIB/
          cp build/ggml/src/libggml*.a $WHISPER_LIB/
          cp include/whisper.h $WHISPER_LIB/
          cp ggml/include/*.h $WHISPER_LIB/
          rm -rf /tmp/whisper.cpp

      - name: Download whisper model for bundling
        run: |
          mkdir -p whisper-model
          curl -L -o whisper-model/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

      - name: Set CGO environment
        run: |
          echo "CGO_CFLAGS=-DSQLITE_ENABLE_FTS5 -I$HOME/.goclaw/lib/whisper" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$HOME/.goclaw/lib/whisper $HOME/.goclaw/lib/whisper/libwhisper.a $HOME/.goclaw/lib/whisper/libggml.a $HOME/.goclaw/lib/whisper/libggml-base.a $HOME/.goclaw/lib/whisper/libggml-cpu.a -lm -lstdc++ -fopenmp -lpthread" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: release --clean --split
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1
          GGOOS: linux
          GGOARCH: arm64

      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux-arm64
          path: dist/
          retention-days: 1

  # Build Darwin AMD64 natively on Intel macOS runner
  build-darwin-amd64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install macOS build dependencies
        run: brew install make cmake libomp

      - name: Enable Homebrew GNU Make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build whisper.cpp and dependencies
        run: gmake deps

      - name: Download whisper model for bundling
        run: |
          mkdir -p whisper-model
          curl -L -o whisper-model/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

      - name: Set CGO environment
        run: |
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          echo "CGO_CFLAGS=-DSQLITE_ENABLE_FTS5 -I$HOME/.goclaw/lib/whisper" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$HOME/.goclaw/lib/whisper -Wl,-no_warn_duplicate_libraries $LIBOMP_PREFIX/lib/libomp.a" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$HOME/.goclaw/lib/whisper" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/.goclaw/lib/whisper" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: release --clean --split
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1
          GGOOS: darwin
          GGOARCH: amd64

      - uses: actions/upload-artifact@v6
        with:
          name: dist-darwin-amd64
          path: dist/
          retention-days: 1

  # Build Darwin ARM64 natively on Apple Silicon runner
  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install macOS build dependencies
        run: brew install make cmake libomp

      - name: Enable Homebrew GNU Make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build whisper.cpp and dependencies
        run: gmake deps

      - name: Download whisper model for bundling
        run: |
          mkdir -p whisper-model
          curl -L -o whisper-model/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

      - name: Set CGO environment
        run: |
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          echo "CGO_CFLAGS=-DSQLITE_ENABLE_FTS5 -I$HOME/.goclaw/lib/whisper" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$HOME/.goclaw/lib/whisper -Wl,-no_warn_duplicate_libraries $LIBOMP_PREFIX/lib/libomp.a" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$HOME/.goclaw/lib/whisper" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/.goclaw/lib/whisper" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: release --clean --split
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1
          GGOOS: darwin
          GGOARCH: arm64

      - uses: actions/upload-artifact@v6
        with:
          name: dist-darwin-arm64
          path: dist/
          retention-days: 1

  # Merge all builds and create release
  release:
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # Download all build artifacts into dist/
      - uses: actions/download-artifact@v7
        with:
          name: dist-linux-amd64
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          name: dist-linux-arm64
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          name: dist-darwin-amd64
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          name: dist-darwin-arm64
          path: dist/

      - name: List dist contents
        run: find dist -type f | head -50

      # Docker setup for multi-arch images
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract release notes from CHANGELOG for the current tag
      - name: Write release notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release ${TAG}" > /tmp/release_notes.md
          fi

      - name: Append auto-generated PR list
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")
          
          echo "" >> /tmp/release_notes.md
          
          if [ -n "$PREV_TAG" ]; then
            gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body' >> /tmp/release_notes.md
          else
            gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" \
              --jq '.body' >> /tmp/release_notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Merge and release
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          args: continue --merge
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update release notes (goreleaser continue doesn't support --release-notes)
      - name: Update release notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release edit "$TAG" --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
